<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Velocity Spherical Asset Management</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0d0f18; color: white; font-family: monospace; overflow: hidden; }
        
        #lobby { padding: 20px; max-width: 650px; margin: 0 auto; margin-top: 50px; background: rgba(0,0,0,0.5); border: 2px solid #444; border-radius: 10px; }
        
        #points-container { margin-bottom: 25px; text-align: center; }
        #slots-text { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: #ffcc00; }
        #points-visual { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
        .point-block { width: 18px; height: 18px; background: #222; border: 1px solid #444; border-radius: 2px; transition: all 0.1s; }
        .point-block.used { background: #e94560; border-color: #ff4757; box-shadow: 0 0 8px #ff4757; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .stat-label { font-size: 1.1em; flex: 1; }
        .stat-control { display: flex; align-items: center; gap: 15px; flex: 1; justify-content: flex-end; }
        .stat-slider { width: 100%; max-width: 200px; accent-color: #e94560; cursor: pointer; }
        .stat-val { font-size: 1.3em; font-weight: bold; width: 30px; text-align: right; color: white; }

        button { background: #e94560; color: white; border: none; padding: 12px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background: #d03050; }
        #deploy-btn { width: 100%; font-size: 1.4em; margin-top: 20px; padding: 15px; }
        
        #gameCanvas { 
            display: none; background-color: #16213e; cursor: crosshair; position: absolute; 
            top: 50%; left: 50%; transform: translate(-50%, -50%); 
            max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #global-score { display: none; position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px 30px; border-radius: 10px; font-size: 2.5em; font-weight: bold; border: 2px solid #555; z-index: 10; pointer-events: none; }
        
        #personal-hud { display: none; position: absolute; bottom: 20px; left: 20px; pointer-events: none; background: rgba(0,0,0,0.85); padding: 20px; border-radius: 10px; z-index: 10; border: 2px solid #555; width: 300px; }
        #personal-hud h3 { margin: 0 0 10px 0; color: #fff; font-size: 1.5em; border-bottom: 1px solid #444; padding-bottom: 5px; }
        #ammo-display { color: #ffcc00; font-size: 1.4em; margin: 10px 0; font-weight: bold; }
        .bar-container { width: 100%; height: 25px; background: #222; border: 2px solid #fff; border-radius: 5px; overflow: hidden; margin-top: 10px; position: relative; }
        #battery-bar { height: 100%; width: 100%; background: lime; transition: width 0.2s, background 0.2s; }
        .bar-label { position: absolute; width: 100%; text-align: center; top: 3px; font-weight: bold; color: black; text-shadow: 1px 1px 0px rgba(255,255,255,0.5); }
        
        /* Dev Console */
        #dev-panel { display: none; position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.85); border: 2px solid lime; padding: 15px; border-radius: 8px; z-index: 100; max-height: 90vh; overflow-y: auto; color: lime; width: 380px; pointer-events: auto; }
        #dev-panel h2 { margin-top: 0; border-bottom: 1px solid lime; padding-bottom: 5px; }
        .dev-row { margin-bottom: 12px; display: flex; flex-direction: column; }
        .dev-row label { font-size: 0.85em; margin-bottom: 3px; font-weight: bold; }
        .dev-row .input-group { display: flex; gap: 10px; align-items: center; }
        .dev-row input[type="range"] { flex-grow: 1; accent-color: lime; cursor: pointer; }
        .dev-row input[type="number"] { width: 60px; background: #222; color: lime; border: 1px solid #444; padding: 3px; text-align: center; }
        .dev-row input[type="checkbox"] { transform: scale(1.5); accent-color: lime; cursor: pointer; }
        .dev-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .dev-actions button { flex: 1 1 45%; font-weight: bold; padding: 8px; color: black; background: lime; }
        .dev-actions button:hover { background: #00cc00; }
        .admin-btn { background: #ffaa00 !important; flex: 1 1 100% !important; margin-bottom: 5px; }
        .admin-btn:hover { background: #e69900 !important; }
        .admin-clear { background: #ff4444 !important; color: white !important; }
        .admin-clear:hover { background: #cc0000 !important; }
        .btn-reset { background: #ff4444 !important; color: white !important; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1 style="text-align: center; margin-top: 0;">Engineering Phase</h1>
        <div id="points-container">
            <div id="slots-text">20 Points Remaining</div>
            <div id="points-visual"></div>
        </div>
        
        <div class="stat-row">
            <span class="stat-label">Chassis Mobility (Speed)</span>
            <div class="stat-control">
                <input type="range" id="stat-speed" class="stat-slider" min="1" max="10" value="1" oninput="handleStatChange('speed')">
                <span id="val-speed" class="stat-val">1</span>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Pneumatic Pressure (Velocity)</span>
            <div class="stat-control">
                <input type="range" id="stat-velocity" class="stat-slider" min="1" max="10" value="1" oninput="handleStatChange('velocity')">
                <span id="val-velocity" class="stat-val">1</span>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Emitter Cycle (Fire Rate)</span>
            <div class="stat-control">
                <input type="range" id="stat-fireRate" class="stat-slider" min="1" max="10" value="1" oninput="handleStatChange('fireRate')">
                <span id="val-fireRate" class="stat-val">1</span>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Asset Capacity (Ammo Limit)</span>
            <div class="stat-control">
                <input type="range" id="stat-capacity" class="stat-slider" min="1" max="10" value="1" oninput="handleStatChange('capacity')">
                <span id="val-capacity" class="stat-val">1</span>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Battery Reserves (Energy)</span>
            <div class="stat-control">
                <input type="range" id="stat-battery" class="stat-slider" min="1" max="10" value="1" oninput="handleStatChange('battery')">
                <span id="val-battery" class="stat-val">1</span>
            </div>
        </div>
        <button id="deploy-btn" onclick="deployRobot()">Deploy to Gymnasium</button>
    </div>

    <!-- GLOBAL SCOREBOARD -->
    <div id="global-score">
        <span style="color: #ff4757;">RED: <span id="score-red">0</span></span>
        <span style="color: #666; margin: 0 15px;">|</span>
        <span style="color: #1e90ff;">BLUE: <span id="score-blue">0</span></span>
    </div>

    <!-- PERSONAL HUD -->
    <div id="personal-hud">
        <h3 id="player-id-display"></h3>
        <div id="ammo-display">Dodgeballs: 0 / 0</div>
        <div class="bar-container">
            <div id="battery-bar"></div>
            <div class="bar-label">SYSTEM BATTERY</div>
        </div>
    </div>
    
    <div id="dev-panel">
        <h2>Physics Dashboard</h2>
        <div class="dev-actions" style="margin-top: 0; margin-bottom: 15px;">
            <button class="admin-btn" onclick="startMatch()">Admin: Start Match (Countdown)</button>
            <button class="admin-btn admin-clear" onclick="clearDodgeballs()">Admin: Clear All Balls</button>
        </div>
        <div id="dev-inputs"></div>
        <div class="dev-actions">
            <button class="btn-reset" onclick="resetToDefaults()">Revert to Defaults</button>
            <button class="btn-save" onclick="printDefaults()">Copy Current as Defaults</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, onChildAdded, onChildRemoved, onDisconnect, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB3uYYcGIivcmIxrxJKGkbVP9JveKW0myM",
          authDomain: "dodgeball-98f77.firebaseapp.com",
          databaseURL: "https://dodgeball-98f77-default-rtdb.firebaseio.com",
          projectId: "dodgeball-98f77",
          storageBucket: "dodgeball-98f77.firebasestorage.app",
          messagingSenderId: "196421389769",
          appId: "1:196421389769:web:6846de5440459339cc6c18"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGameState = 'waiting'; 
        let countdownEnd = 0;
        let adminTriggerId = null;
        let adminHasSpawned = false;

        const gameConfigDefaults = {
            centerWallActive: true,     
            playerSmoothing: 0.15,      // NEW: LERP factor (lower = smoother glide, higher = fast/jerky)
            adminSpawnCount: 15,        
            adminSpawnVelocity: 5.0,    
            powerFlightTime: 800,       
            frictionRetained: 0.98,
            wallBounceRetained: 0.85,   
            pickupMaxSpeed: 3.5,        
            funnelActiveSpeed: 2.5,     
            funnelGravity: 0.05,        
            robotBaseSpeed: 2.0,        
            robotSpeedPerStat: 0.5,     
            ballBaseVelocity: 6.0,      
            ballVelocityPerStat: 2.5,   
            cooldownBase: 1200,         
            cooldownPerStat: 100,       
            capacityBaseAmmo: 2.0,      
            capacityPerStat: 2.0,
            batteryBase: 100,           
            batteryPerStat: 25,         
            hitPenalty: 40,             
            rechargeRate: 0.5           
        };

        let gameConfig = { ...gameConfigDefaults };

        const configRanges = {
            playerSmoothing: { min: 0.01, max: 1.0, step: 0.01 },
            adminSpawnCount: { min: 1, max: 50, step: 1 },
            adminSpawnVelocity: { min: 0, max: 20, step: 0.5 },
            powerFlightTime: { min: 100, max: 2500, step: 50 },
            frictionRetained: { min: 0.90, max: 1.00, step: 0.01 },
            wallBounceRetained: { min: 0.10, max: 1.00, step: 0.05 },
            pickupMaxSpeed: { min: 1, max: 8, step: 0.1 },
            funnelActiveSpeed: { min: 1, max: 8, step: 0.1 },
            funnelGravity: { min: 0, max: 0.3, step: 0.01 },
            robotBaseSpeed: { min: 0.5, max: 10, step: 0.1 },
            robotSpeedPerStat: { min: 0.1, max: 3, step: 0.1 },
            ballBaseVelocity: { min: 2, max: 15, step: 0.5 },
            ballVelocityPerStat: { min: 0.5, max: 5, step: 0.1 },
            cooldownBase: { min: 200, max: 2000, step: 50 },
            cooldownPerStat: { min: 10, max: 300, step: 10 },
            capacityBaseAmmo: { min: 1, max: 10, step: 1 },
            capacityPerStat: { min: 1, max: 5, step: 1 },
            batteryBase: { min: 50, max: 500, step: 10 },
            batteryPerStat: { min: 5, max: 100, step: 5 },
            hitPenalty: { min: 5, max: 200, step: 5 },
            rechargeRate: { min: 0.1, max: 5, step: 0.1 }
        };

        const devInputsDiv = document.getElementById('dev-inputs');
        Object.keys(gameConfigDefaults).forEach(key => {
            const wrapper = document.createElement('div');
            wrapper.className = 'dev-row';
            
            if (key === 'centerWallActive') {
                wrapper.style.flexDirection = 'row';
                wrapper.style.justifyContent = 'space-between';
                wrapper.style.alignItems = 'center';
                wrapper.innerHTML = `
                    <label>Restrict Crossing Center Line</label>
                    <input type="checkbox" id="dev-${key}" ${gameConfig[key] ? 'checked' : ''} 
                           onchange="updateSetting('${key}', this.checked)">
                `;
            } else {
                let r = configRanges[key];
                wrapper.innerHTML = `
                    <label>${key}</label>
                    <div class="input-group">
                        <input type="range" id="slider-${key}" min="${r.min}" max="${r.max}" step="${r.step}" value="${gameConfig[key]}" 
                               oninput="document.getElementById('num-${key}').value = this.value" 
                               onchange="updateSetting('${key}', this.value)">
                        <input type="number" id="num-${key}" step="${r.step}" value="${gameConfig[key]}" 
                               onchange="document.getElementById('slider-${key}').value = this.value; updateSetting('${key}', this.value)">
                    </div>
                `;
            }
            devInputsDiv.appendChild(wrapper);
        });

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'd') {
                const panel = document.getElementById('dev-panel');
                panel.style.display = panel.style.display === 'none' || panel.style.display === '' ? 'block' : 'none';
            }
        });

        window.updateSetting = function(key, value) {
            let parsedVal = typeof value === 'boolean' ? value : parseFloat(value);
            set(ref(db, 'settings/' + key), parsedVal);
        }
        window.resetToDefaults = function() { set(ref(db, 'settings'), gameConfigDefaults); }
        window.printDefaults = function() {
            alert("To save permanently, copy this JSON and replace 'const gameConfigDefaults':\n\n" + JSON.stringify(gameConfig, null, 4));
        }

        onValue(ref(db, 'settings'), (snapshot) => {
            if (snapshot.exists()) {
                let newConfig = snapshot.val();
                gameConfig = { ...gameConfigDefaults, ...newConfig }; 
                Object.keys(gameConfig).forEach(key => {
                    if (key === 'centerWallActive') {
                        let checkbox = document.getElementById(`dev-${key}`);
                        if(checkbox && document.activeElement !== checkbox) checkbox.checked = gameConfig[key];
                    } else {
                        let slider = document.getElementById(`slider-${key}`);
                        let num = document.getElementById(`num-${key}`);
                        if (slider && document.activeElement !== slider) slider.value = gameConfig[key];
                        if (num && document.activeElement !== num) num.value = gameConfig[key];
                    }
                });
                if (document.getElementById('gameCanvas').style.display === 'block') calculateRobotStats();
            }
        });

        onValue(ref(db, 'gameState'), (snapshot) => {
            if (snapshot.exists()) {
                let gs = snapshot.val();
                currentGameState = gs.state;
                countdownEnd = gs.timerEnd;
                adminTriggerId = gs.adminId;
                if (gs.state === 'countdown') adminHasSpawned = false; 
                
                if (gs.score) {
                    document.getElementById('score-red').innerText = gs.score.red || 0;
                    document.getElementById('score-blue').innerText = gs.score.blue || 0;
                }
            } else {
                currentGameState = 'waiting';
            }
        });

        const MAX_POINTS = 25;
        const stats = { speed: 1, velocity: 1, fireRate: 1, capacity: 1, battery: 1 };
        
        window.handleStatChange = function(changedStat) {
            let slider = document.getElementById(`stat-${changedStat}`);
            let requestedValue = parseInt(slider.value);
            let sumOthers = 0;
            for (let key in stats) { if (key !== changedStat) sumOthers += stats[key]; }
            let maxAllowed = Math.min(10, MAX_POINTS - sumOthers);
            if (requestedValue > maxAllowed) {
                requestedValue = maxAllowed;
                slider.value = requestedValue;
            }
            stats[changedStat] = requestedValue;
            document.getElementById(`val-${changedStat}`).innerText = requestedValue;
            updatePointsVisual();
        }

        function updatePointsVisual() {
            let used = stats.speed + stats.velocity + stats.fireRate + stats.capacity + stats.battery;
            let left = MAX_POINTS - used;
            document.getElementById('slots-text').innerText = `${left} Point${left !== 1 ? 's' : ''} Remaining`;
            
            let container = document.getElementById('points-visual');
            container.innerHTML = '';
            for(let i = 0; i < MAX_POINTS; i++) {
                let block = document.createElement('div');
                block.className = 'point-block ' + (i < used ? 'used' : 'empty');
                container.appendChild(block);
            }
        }
        updatePointsVisual();

        const playerId = "Student_" + Math.floor(Math.random() * 1000);
        let playerRef;
        const keys = {};
        
        let otherPlayers = {};
        let renderPlayers = {}; // LERP Smoothing state
        let activeSpheres = [];

        let myRobot = {
            x: 0, y: 0, size: 20, 
            speedBase: 0, emitterPower: 0, maxDodgeballs: 0, currentDodgeballs: 0, 
            maxBattery: 100, currentBattery: 100,
            fireCooldown: 1000, lastFiredTime: 0,
            isInvulnerable: false,
            color: Math.random() > 0.5 ? '#ff4757' : '#1e90ff' 
        };

        function calculateRobotStats() {
            myRobot.speedBase = gameConfig.robotBaseSpeed + (stats.speed * gameConfig.robotSpeedPerStat); 
            myRobot.size = 20 + (stats.capacity * 3);    
            myRobot.emitterPower = gameConfig.ballBaseVelocity + (stats.velocity * gameConfig.ballVelocityPerStat); 
            myRobot.fireCooldown = Math.max(gameConfig.cooldownBase - (stats.fireRate * gameConfig.cooldownPerStat), 50); 
            myRobot.maxDodgeballs = gameConfig.capacityBaseAmmo + (stats.capacity * gameConfig.capacityPerStat); 
            if (myRobot.currentDodgeballs > myRobot.maxDodgeballs) myRobot.currentDodgeballs = myRobot.maxDodgeballs;
            
            let previousMax = myRobot.maxBattery;
            myRobot.maxBattery = gameConfig.batteryBase + (stats.battery * gameConfig.batteryPerStat);
            if (myRobot.currentBattery === undefined || myRobot.currentBattery === previousMax) {
                myRobot.currentBattery = myRobot.maxBattery;
            }
            if (myRobot.currentBattery > myRobot.maxBattery) myRobot.currentBattery = myRobot.maxBattery;
            
            updateHUD();
        }

        function updateHUD() {
            let ammoDisplay = document.getElementById('ammo-display');
            if (currentGameState === 'waiting') {
                ammoDisplay.innerText = `Dodgeballs: WARMUP`;
            } else {
                ammoDisplay.innerText = `Dodgeballs: ${myRobot.currentDodgeballs} / ${myRobot.maxDodgeballs}`;
            }

            let batPct = (myRobot.currentBattery / myRobot.maxBattery) * 100;
            let bar = document.getElementById('battery-bar');
            bar.style.width = batPct + '%';
            if (batPct > 50) bar.style.background = 'lime';
            else if (batPct > 20) bar.style.background = 'yellow';
            else bar.style.background = 'red';
        }

        window.deployRobot = function() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            document.getElementById('personal-hud').style.display = 'block';
            document.getElementById('global-score').style.display = 'block';
            
            let teamName = myRobot.color === '#ff4757' ? 'Red' : 'Blue';
            document.getElementById('player-id-display').innerHTML = `${playerId} <br><span style="color:${myRobot.color}">[${teamName} Team]</span>`;
            
            const canvas = document.getElementById('gameCanvas');
            canvas.width = 1600;
            canvas.height = 900;

            calculateRobotStats();
            myRobot.currentDodgeballs = myRobot.maxDodgeballs; 
            myRobot.currentBattery = myRobot.maxBattery;
            
            myRobot.x = myRobot.color === '#ff4757' ? 200 : canvas.width - 200;
            myRobot.y = canvas.height / 2;

            playerRef = ref(db, 'players/' + playerId);
            onDisconnect(playerRef).remove(); 
            
            window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

            canvas.addEventListener('mousedown', (e) => {
                if (currentGameState === 'countdown' || myRobot.currentBattery <= 0) return;

                let isWarmup = (currentGameState === 'waiting');
                let now = Date.now();

                if (now - myRobot.lastFiredTime >= myRobot.fireCooldown) {
                    if (isWarmup || myRobot.currentDodgeballs > 0) {
                        myRobot.lastFiredTime = now;

                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width;
                        const scaleY = canvas.height / rect.height;
                        
                        const clickX = (e.clientX - rect.left) * scaleX;
                        const clickY = (e.clientY - rect.top) * scaleY;

                        const dx = clickX - (myRobot.x + myRobot.size/2);
                        const dy = clickY - (myRobot.y + myRobot.size/2);
                        const angle = Math.atan2(dy, dx);

                        if (!isWarmup) myRobot.currentDodgeballs--;
                        updateHUD();

                        const sphereRef = ref(db, 'spheres');
                        push(sphereRef, {
                            x: myRobot.x + myRobot.size/2,
                            y: myRobot.y + myRobot.size/2,
                            vx: Math.cos(angle) * myRobot.emitterPower,
                            vy: Math.sin(angle) * myRobot.emitterPower,
                            color: myRobot.color, 
                            firedAt: Date.now() 
                        });
                    }
                }
            });

            onValue(ref(db, 'players'), (snapshot) => { otherPlayers = snapshot.val() || {}; });
            onValue(ref(db, 'spheres'), (snapshot) => { if (!snapshot.exists()) activeSpheres = []; });

            onChildAdded(ref(db, 'spheres'), (snapshot) => {
                const data = snapshot.val();
                activeSpheres.push({
                    id: snapshot.key, 
                    x: data.x, y: data.y,
                    vx: data.vx, vy: data.vy,
                    color: data.color || '#ffcc00', 
                    firedAt: data.firedAt || Date.now(),
                    claimPending: false
                });
            });

            onChildRemoved(ref(db, 'spheres'), (snapshot) => {
                activeSpheres = activeSpheres.filter(s => s.id !== snapshot.key);
            });

            requestAnimationFrame(gameLoop);
            setInterval(syncToServer, 1000/15); 
        }

        window.startMatch = function() {
            clearDodgeballs();
            set(ref(db, 'gameState'), {
                state: 'countdown',
                timerEnd: Date.now() + 5000,
                adminId: playerId,
                score: { red: 0, blue: 0 } 
            });
        }

        window.clearDodgeballs = function() {
            remove(ref(db, 'spheres'));
            set(ref(db, 'gameState'), { state: 'waiting', timerEnd: 0, adminId: null, score: { red: 0, blue: 0 } });
        }

        function releaseDodgeballsInternal() {
            const sphereRef = ref(db, 'spheres');
            let count = Math.floor(gameConfig.adminSpawnCount);
            let velocity = gameConfig.adminSpawnVelocity;
            const internalWidth = 1600;
            const internalHeight = 900;

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const power = velocity > 0 ? (velocity / 2) + Math.random() * (velocity / 2) : 0;
                const startY = (internalHeight / count) * i + (internalHeight / count) / 2;
                
                push(sphereRef, {
                    x: internalWidth / 2, y: startY,
                    vx: Math.cos(angle) * power, vy: Math.sin(angle) * power,
                    color: '#ffcc00', 
                    firedAt: Date.now()
                });
            }
        }

        function gameLoop() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const now = Date.now();

            let nextX = myRobot.x;
            let nextY = myRobot.y;
            
            let activeSpeed = myRobot.speedBase;
            if (myRobot.currentBattery <= 0) {
                activeSpeed = myRobot.speedBase * 0.2; 
            }

            if (currentGameState !== 'countdown') {
                if ((keys['w'] || keys['arrowup']) && myRobot.y > 0) nextY -= activeSpeed;
                if ((keys['s'] || keys['arrowdown']) && myRobot.y < canvas.height - myRobot.size) nextY += activeSpeed;
                if ((keys['a'] || keys['arrowleft']) && myRobot.x > 0) nextX -= activeSpeed;
                if ((keys['d'] || keys['arrowright']) && myRobot.x < canvas.width - myRobot.size) nextX += activeSpeed;
            } else {
                myRobot.currentDodgeballs = 0;
                myRobot.currentBattery = myRobot.maxBattery;
            }

            if (gameConfig.centerWallActive) {
                if (myRobot.color === '#ff4757' && nextX + myRobot.size > centerX) nextX = centerX - myRobot.size;
                if (myRobot.color === '#1e90ff' && nextX < centerX) nextX = centerX;
            }

            myRobot.x = nextX;
            myRobot.y = nextY;

            let inRechargeZone = false;
            if (myRobot.color === '#ff4757' && myRobot.x < 150) inRechargeZone = true;
            if (myRobot.color === '#1e90ff' && myRobot.x > canvas.width - 150 - myRobot.size) inRechargeZone = true;
            
            if (inRechargeZone && myRobot.currentBattery < myRobot.maxBattery && currentGameState !== 'countdown') {
                myRobot.currentBattery += gameConfig.rechargeRate;
                if (myRobot.currentBattery > myRobot.maxBattery) myRobot.currentBattery = myRobot.maxBattery;
            }

            updateHUD();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 71, 87, 0.1)';
            ctx.fillRect(0, 0, 150, canvas.height);
            ctx.fillStyle = 'rgba(30, 144, 255, 0.1)';
            ctx.fillRect(canvas.width - 150, 0, 150, canvas.height);

            ctx.strokeStyle = gameConfig.centerWallActive ? '#ff4444' : 'white';
            ctx.lineWidth = gameConfig.centerWallActive ? 3 : 1;
            ctx.setLineDash([10, 15]);
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();

            const radius = 8;
            let bounce = gameConfig.wallBounceRetained;

            // Ball Physics
            for (let i = 0; i < activeSpheres.length; i++) {
                let s = activeSpheres[i];
                let flightTime = now - s.firedAt;
                
                if (flightTime > gameConfig.powerFlightTime) {
                    s.vx *= gameConfig.frictionRetained;
                    s.vy *= gameConfig.frictionRetained;
                }
                let currentSpeed = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
                if (currentSpeed < gameConfig.funnelActiveSpeed && flightTime > gameConfig.powerFlightTime) {
                    if (s.x < centerX - 10) s.vx += gameConfig.funnelGravity; 
                    else if (s.x > centerX + 10) s.vx -= gameConfig.funnelGravity; 
                }

                s.x += s.vx; s.y += s.vy;

                if (s.x < radius) { s.x = radius; s.vx *= -bounce; s.vy *= bounce; }
                if (s.x > canvas.width - radius) { s.x = canvas.width - radius; s.vx *= -bounce; s.vy *= bounce; }
                if (s.y < radius) { s.y = radius; s.vy *= -bounce; s.vx *= bounce; }
                if (s.y > canvas.height - radius) { s.y = canvas.height - radius; s.vy *= -bounce; s.vx *= bounce; }
            }

            for (let i = 0; i < activeSpheres.length; i++) {
                let s1 = activeSpheres[i];
                if ((now - s1.firedAt) <= gameConfig.powerFlightTime) continue; 
                for (let j = i + 1; j < activeSpheres.length; j++) {
                    let s2 = activeSpheres[j];
                    if ((now - s2.firedAt) <= gameConfig.powerFlightTime) continue; 

                    let dx = s2.x - s1.x; let dy = s2.y - s1.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let minDist = radius * 2; 

                    if (distance < minDist && distance > 0) {
                        let overlap = minDist - distance;
                        let nx = dx / distance; let ny = dy / distance;
                        let pushX = (nx * overlap) / 2; let pushY = (ny * overlap) / 2;
                        s1.x -= pushX; s1.y -= pushY; s2.x += pushX; s2.y += pushY;
                        
                        let vxDiff = s1.vx - s2.vx; let vyDiff = s1.vy - s2.vy;
                        let dotProduct = (vxDiff * nx) + (vyDiff * ny);
                        
                        if (dotProduct > 0) {
                            s1.vx -= dotProduct * nx; s1.vy -= dotProduct * ny;
                            s2.vx += dotProduct * nx; s2.vy += dotProduct * ny;
                        }
                    }
                }
            }

            for (let i = activeSpheres.length - 1; i >= 0; i--) {
                let s = activeSpheres[i];
                let flightTime = now - s.firedAt;
                let currentSpeed = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
                let isDangerous = flightTime <= gameConfig.powerFlightTime;

                ctx.fillStyle = isDangerous ? s.color : '#ffcc00'; 
                ctx.beginPath();
                ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
                ctx.fill();

                let testX = s.x; let testY = s.y;
                if (s.x < myRobot.x) testX = myRobot.x;
                else if (s.x > myRobot.x + myRobot.size) testX = myRobot.x + myRobot.size;
                if (s.y < myRobot.y) testY = myRobot.y;
                else if (s.y > myRobot.y + myRobot.size) testY = myRobot.y + myRobot.size;
                let dist = Math.sqrt(Math.pow(s.x - testX, 2) + Math.pow(s.y - testY, 2));

                // --- NEW RICOCHET ENGINE ---
                if (isDangerous && s.color !== myRobot.color && s.color !== '#ffcc00' && currentGameState === 'playing' && !myRobot.isInvulnerable) {
                    if (dist <= radius) {
                        
                        // 1. Calculate Exact Ricochet Angle
                        let nx = (s.x - testX) / dist;
                        let ny = (s.y - testY) / dist;
                        if (dist === 0) { nx = 1; ny = 0; }
                        
                        let dotProduct = (s.vx * nx) + (s.vy * ny);
                        let newVx = s.vx; let newVy = s.vy;
                        if (dotProduct < 0) {
                            newVx = s.vx - 2 * dotProduct * nx;
                            newVy = s.vy - 2 * dotProduct * ny;
                        } else {
                            newVx = -s.vx; newVy = -s.vy;
                        }

                        // 2. Kill the old ball and spawn the ricochet immediately
                        remove(ref(db, 'spheres/' + s.id));
                        activeSpheres.splice(i, 1);
                        
                        push(ref(db, 'spheres'), {
                            x: s.x + (nx * 3), // Nudge out of hitbox slightly
                            y: s.y + (ny * 3),
                            vx: newVx,
                            vy: newVy,
                            color: s.color, // Keeps enemy color so it can hit others!
                            firedAt: s.firedAt // Preserves original flight timer
                        });
                        
                        // 3. Take Damage
                        myRobot.currentBattery -= gameConfig.hitPenalty;
                        if (myRobot.currentBattery < 0) myRobot.currentBattery = 0;

                        // 4. Update Scoreboard
                        let enemyTeam = myRobot.color === '#ff4757' ? 'blue' : 'red';
                        runTransaction(ref(db, `gameState/score/${enemyTeam}`), (currentScore) => {
                            return (currentScore || 0) + 1;
                        });

                        // 5. Trigger I-Frames
                        myRobot.isInvulnerable = true;
                        setTimeout(() => { myRobot.isInvulnerable = false; }, 1000);
                        continue;
                    }
                }

                if (!isDangerous && currentSpeed < gameConfig.pickupMaxSpeed && myRobot.currentDodgeballs < myRobot.maxDodgeballs && !s.claimPending) {
                    if (dist <= radius) {
                        s.claimPending = true; 
                        if (currentGameState !== 'waiting') myRobot.currentDodgeballs++;
                        
                        runTransaction(ref(db, 'spheres/' + s.id + '/claimedBy'), (currentOwner) => {
                            if (currentOwner === null) return playerId; 
                            return; 
                        }).then((result) => {
                            if (result.committed && result.snapshot.val() === playerId) {
                                remove(ref(db, 'spheres/' + s.id));
                            } else {
                                s.claimPending = false; 
                                if (currentGameState !== 'waiting') myRobot.currentDodgeballs--;
                            }
                        });
                    }
                }
            }

            // --- LERP SMOOTHING FOR OTHER PLAYERS ---
            Object.keys(otherPlayers).forEach(id => {
                if (id !== playerId) {
                    let target = otherPlayers[id];
                    
                    if (!renderPlayers[id]) renderPlayers[id] = { ...target };
                    
                    // Slide smoothly toward the new coordinate based on the Dev Console setting
                    let smoothing = gameConfig.playerSmoothing;
                    renderPlayers[id].x += (target.x - renderPlayers[id].x) * smoothing;
                    renderPlayers[id].y += (target.y - renderPlayers[id].y) * smoothing;
                    
                    renderPlayers[id].size = target.size;
                    renderPlayers[id].color = target.color;
                    renderPlayers[id].isInvulnerable = target.isInvulnerable;

                    let p = renderPlayers[id];
                    ctx.fillStyle = p.color;
                    if (p.isInvulnerable) ctx.globalAlpha = 0.3;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.globalAlpha = 1.0;
                }
            });

            Object.keys(renderPlayers).forEach(id => {
                if (!otherPlayers[id]) delete renderPlayers[id];
            });

            if (myRobot.isInvulnerable && Math.floor(now / 100) % 2 === 0) ctx.fillStyle = 'white';
            else ctx.fillStyle = myRobot.color;
            
            ctx.fillRect(myRobot.x, myRobot.y, myRobot.size, myRobot.size);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.setLineDash([]);
            ctx.strokeRect(myRobot.x - 2, myRobot.y - 2, myRobot.size + 4, myRobot.size + 4);

            if (currentGameState === 'countdown') {
                let timeLeft = Math.ceil((countdownEnd - now) / 1000);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 150px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                if (timeLeft > 0) {
                    ctx.fillText(timeLeft, canvas.width / 2, canvas.height / 2);
                } else {
                    ctx.fillText("GO!", canvas.width / 2, canvas.height / 2);
                    if (adminTriggerId === playerId && !adminHasSpawned) {
                        adminHasSpawned = true;
                        set(ref(db, 'gameState/state'), 'playing');
                        releaseDodgeballsInternal();
                    }
                }
            } else if (currentGameState === 'waiting') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.font = 'bold 40px monospace';
                ctx.textAlign = 'center';
                ctx.fillText("Waiting for Admin to start match...", canvas.width / 2, 100);
            }

            requestAnimationFrame(gameLoop);
        }

        function syncToServer() {
            set(playerRef, { x: myRobot.x, y: myRobot.y, size: myRobot.size, color: myRobot.color, isInvulnerable: myRobot.isInvulnerable });
        }
    </script>
</body>
</html>
