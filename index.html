<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Velocity Spherical Asset Management</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a2e; color: white; font-family: monospace; overflow: hidden; }
        #lobby { padding: 20px; max-width: 600px; margin: 0 auto; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; }
        button { background: #e94560; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #d03050; }
        #deploy-btn { width: 100%; font-size: 1.2em; margin-top: 20px; }
        #gameCanvas { display: none; background-color: #16213e; width: 100vw; height: 100vh; cursor: crosshair; }
        #hud { display: none; position: absolute; top: 10px; left: 10px; pointer-events: none; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
        #hud h3, #hud h2 { margin: 5px 0; }
        #ammo-display { color: #00ffcc; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>Engineering Phase</h1>
        <p>Power Slots Available: <span id="slots">6</span>/10</p>
        
        <div class="stat-row">
            <span>Chassis Mobility (Speed)</span>
            <div>
                <button onclick="changeStat('speed', -1)">-</button>
                <span id="val-speed" style="margin: 0 10px;">1</span>
                <button onclick="changeStat('speed', 1)">+</button>
            </div>
        </div>
        <div class="stat-row">
            <span>Pneumatic Emitter (Velocity)</span>
            <div>
                <button onclick="changeStat('fireRate', -1)">-</button>
                <span id="val-fireRate" style="margin: 0 10px;">1</span>
                <button onclick="changeStat('fireRate', 1)">+</button>
            </div>
        </div>
        <div class="stat-row">
            <span>Asset Capacity (Ammo limit)</span>
            <div>
                <button onclick="changeStat('capacity', -1)">-</button>
                <span id="val-capacity" style="margin: 0 10px;">1</span>
                <button onclick="changeStat('capacity', 1)">+</button>
            </div>
        </div>
        <div class="stat-row">
            <span>Battery Reserves (Energy)</span>
            <div>
                <button onclick="changeStat('battery', -1)">-</button>
                <span id="val-battery" style="margin: 0 10px;">1</span>
                <button onclick="changeStat('battery', 1)">+</button>
            </div>
        </div>

        <button id="deploy-btn" onclick="deployRobot()">Deploy to Gymnasium</button>
    </div>

    <div id="hud">
        <h3 id="player-id-display"></h3>
        <h2 id="ammo-display">Ammo: 0 / 0</h2>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, onChildAdded, onChildRemoved, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB3uYYcGIivcmIxrxJKGkbVP9JveKW0myM",
          authDomain: "dodgeball-98f77.firebaseapp.com",
          databaseURL: "https://dodgeball-98f77-default-rtdb.firebaseio.com",
          projectId: "dodgeball-98f77",
          storageBucket: "dodgeball-98f77.firebasestorage.app",
          messagingSenderId: "196421389769",
          appId: "1:196421389769:web:6846de5440459339cc6c18"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const MAX_POINTS = 10;
        let stats = { speed: 1, fireRate: 1, capacity: 1, battery: 1 };
        
        window.changeStat = function(stat, change) {
            let totalUsed = stats.speed + stats.fireRate + stats.capacity + stats.battery;
            if (change > 0 && totalUsed >= MAX_POINTS) return;
            if (stats[stat] + change < 1) return; 
            
            stats[stat] += change;
            document.getElementById(`val-${stat}`).innerText = stats[stat];
            document.getElementById('slots').innerText = MAX_POINTS - (totalUsed + change);
        }

        const playerId = "Student_" + Math.floor(Math.random() * 1000);
        let playerRef;
        const keys = {};
        
        let otherPlayers = {};
        let activeSpheres = []; // Now stores objects with unique IDs

        let myRobot = {
            x: 400, y: 300,
            size: 20, 
            speedBase: 0,
            emitterPower: 0,
            maxAmmo: 0,
            currentAmmo: 0,
            color: Math.random() > 0.5 ? '#ff4757' : '#1e90ff' 
        };

        window.deployRobot = function() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('player-id-display').innerText = `${playerId} (Team ${myRobot.color === '#ff4757' ? 'Red' : 'Blue'})`;
            
            const canvas = document.getElementById('gameCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Apply Stats mathematically
            myRobot.speedBase = 2 + (stats.speed * 0.5); 
            myRobot.size = 20 + (stats.capacity * 3);    
            myRobot.emitterPower = 5 + (stats.fireRate * 2); 
            
            // Setting up Ammo Capacity
            myRobot.maxAmmo = 2 + (stats.capacity * 2); // Base 4 ammo, more points = more ammo
            myRobot.currentAmmo = myRobot.maxAmmo;      // Spawn with full ammo
            document.getElementById('ammo-display').innerText = `Ammo: ${myRobot.currentAmmo} / ${myRobot.maxAmmo}`;

            playerRef = ref(db, 'players/' + playerId);
            onDisconnect(playerRef).remove(); 
            
            window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

            window.addEventListener('mousedown', (e) => {
                if (myRobot.currentAmmo > 0) {
                    // Calculate aim
                    const dx = e.clientX - (myRobot.x + myRobot.size/2);
                    const dy = e.clientY - (myRobot.y + myRobot.size/2);
                    const angle = Math.atan2(dy, dx);

                    // Decrease ammo and update HUD
                    myRobot.currentAmmo--;
                    document.getElementById('ammo-display').innerText = `Ammo: ${myRobot.currentAmmo} / ${myRobot.maxAmmo}`;

                    // Push sphere to database (no longer auto-deleting)
                    const sphereRef = ref(db, 'spheres');
                    push(sphereRef, {
                        x: myRobot.x + myRobot.size/2,
                        y: myRobot.y + myRobot.size/2,
                        vx: Math.cos(angle) * myRobot.emitterPower,
                        vy: Math.sin(angle) * myRobot.emitterPower,
                        color: myRobot.color
                    });
                }
            });

            onValue(ref(db, 'players'), (snapshot) => {
                otherPlayers = snapshot.val() || {};
            });

            // Listen for NEW spheres
            onChildAdded(ref(db, 'spheres'), (snapshot) => {
                const data = snapshot.val();
                activeSpheres.push({
                    id: snapshot.key, // Store the Firebase ID
                    x: data.x, y: data.y,
                    vx: data.vx, vy: data.vy,
                    color: data.color
                });
            });

            // Listen for DELETED spheres (when someone picks them up)
            onChildRemoved(ref(db, 'spheres'), (snapshot) => {
                activeSpheres = activeSpheres.filter(s => s.id !== snapshot.key);
            });

            requestAnimationFrame(gameLoop);
            setInterval(syncToServer, 1000/15); 
        }

        function gameLoop() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // Screen boundaries for robot
            if ((keys['w'] || keys['arrowup']) && myRobot.y > 0) myRobot.y -= myRobot.speedBase;
            if ((keys['s'] || keys['arrowdown']) && myRobot.y < canvas.height - myRobot.size) myRobot.y += myRobot.speedBase;
            if ((keys['a'] || keys['arrowleft']) && myRobot.x > 0) myRobot.x -= myRobot.speedBase;
            if ((keys['d'] || keys['arrowright']) && myRobot.x < canvas.width - myRobot.size) myRobot.x += myRobot.speedBase;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Center Line
            const centerX = canvas.width / 2;
            ctx.strokeStyle = 'white';
            ctx.setLineDash([10, 15]);
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();

            // Simulate and Draw Spheres
            const radius = 8;
            for (let i = activeSpheres.length - 1; i >= 0; i--) {
                let s = activeSpheres[i];
                
                // 1. Apply Friction (Slows down by 1% every frame)
                s.vx *= 0.99;
                s.vy *= 0.99;
                let currentSpeed = Math.sqrt(s.vx*s.vx + s.vy*s.vy);

                // 2. The Funnel (If slow, roll to center line)
                if (currentSpeed < 3) {
                    if (s.x < centerX - 10) s.vx += 0.05; // Roll right
                    else if (s.x > centerX + 10) s.vx -= 0.05; // Roll left
                }

                s.x += s.vx;
                s.y += s.vy;

                // 3. Wall Collisions (Enclosed Arena)
                if (s.x < radius) { s.x = radius; s.vx *= -1; }
                if (s.x > canvas.width - radius) { s.x = canvas.width - radius; s.vx *= -1; }
                if (s.y < radius) { s.y = radius; s.vy *= -1; }
                if (s.y > canvas.height - radius) { s.y = canvas.height - radius; s.vy *= -1; }

                // Draw the sphere
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
                ctx.fill();

                // 4. Pickup / Vacuum Logic
                if (currentSpeed < 2.5 && myRobot.currentAmmo < myRobot.maxAmmo) {
                    // Check if Robot (rectangle) overlaps Sphere (circle)
                    let testX = s.x; let testY = s.y;
                    if (s.x < myRobot.x) testX = myRobot.x;
                    else if (s.x > myRobot.x + myRobot.size) testX = myRobot.x + myRobot.size;
                    if (s.y < myRobot.y) testY = myRobot.y;
                    else if (s.y > myRobot.y + myRobot.size) testY = myRobot.y + myRobot.size;

                    let distX = s.x - testX;
                    let distY = s.y - testY;
                    let distance = Math.sqrt((distX*distX) + (distY*distY));

                    // If touching
                    if (distance <= radius) {
                        // Increase Ammo
                        myRobot.currentAmmo++;
                        document.getElementById('ammo-display').innerText = `Ammo: ${myRobot.currentAmmo} / ${myRobot.maxAmmo}`;
                        
                        // Tell server to delete this ball so no one else gets it
                        remove(ref(db, 'spheres/' + s.id));
                        
                        // Delete locally immediately to prevent double-pickups
                        activeSpheres.splice(i, 1);
                    }
                }
            }

            // Draw other players
            Object.keys(otherPlayers).forEach(id => {
                if (id !== playerId) {
                    let p = otherPlayers[id];
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });

            // Draw my robot
            ctx.fillStyle = myRobot.color;
            ctx.fillRect(myRobot.x, myRobot.y, myRobot.size, myRobot.size);
            
            // Aiming reticle
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.setLineDash([]);
            ctx.strokeRect(myRobot.x - 2, myRobot.y - 2, myRobot.size + 4, myRobot.size + 4);

            requestAnimationFrame(gameLoop);
        }

        function syncToServer() {
            set(playerRef, {
                x: myRobot.x,
                y: myRobot.y,
                size: myRobot.size,
                color: myRobot.color
            });
        }
    </script>
</body>
</html>
